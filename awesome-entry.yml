url: https://github.com/chyxhtc/dsh-ws-recency
name: chyxhtc/dsh-ws-recency
category: session
description:
  en: 'Sidebar session management: workspace groups sorted by latest activity, history older than N days folded behind one control, a global pinned section for native pins, manual "needs follow-up" marks, session delete into a recoverable trash, archived sessions managed from that same trash panel, per-session token statistics split by tool, moving a session to another workspace, and handing the work over to a fresh session with a generated handoff note.'
  zh: 'DSH 侧栏会话管理：工作区分组按最近活跃排序，超过 N 天的历史折叠成一个「展开历史」控件，原生置顶会话汇总到顶部置顶区，可手动标记「需要跟进」，删除会话移入可恢复的回收站（已归档的会话也在同一个面板里管理），按工具拆分的 token 消耗统计，把会话移动到另一个工作区，以及一键把工作交接到新会话（自动生成交接说明并带入）。'
